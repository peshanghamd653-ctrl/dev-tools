[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/devos-kernel",
    "crates/devos-secrets",
    "crates/devos-ai",
    # Not under crates/modules/ on purpose: this is a runtime spike, not a
    # live Module, and it is not registered with the app. See ADR-0010.
    "crates/devos-plugin",
    "crates/modules/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["peshang"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = "10"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
