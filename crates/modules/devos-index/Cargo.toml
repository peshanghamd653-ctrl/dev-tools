[package]
name = "devos-index"
description = "DevOS project index: hybrid FTS5 + embedding code search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
devos-kernel = { path = "../../devos-kernel" }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
ts-rs.workspace = true
# Embeddings come straight from the local Ollama HTTP API rather than
# through `devos-ai`: modules never import each other, and `/api/embed` has
# nothing to do with the streaming-chat provider trait.
reqwest.workspace = true
async-trait.workspace = true
# Symbol extraction. Deliberately three crates and no more: every grammar is
# a generated C parser recompiled on every clean build, and
# `tree-sitter-typescript` covers TS, TSX, JS and JSX on its own. Declared
# here rather than in the workspace manifest because no other crate parses
# source code. See `src/symbols.rs` for why the language set stops here.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
