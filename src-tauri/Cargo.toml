[package]
name = "devos-desktop"
description = "DevOS desktop shell: Tauri app wiring the kernel and modules"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name conflict on Windows.
name = "devos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devos-kernel = { path = "../crates/devos-kernel" }
devos-terminal = { path = "../crates/modules/devos-terminal" }
devos-git = { path = "../crates/modules/devos-git" }
devos-ai = { path = "../crates/devos-ai" }
devos-secrets = { path = "../crates/devos-secrets" }
devos-index = { path = "../crates/modules/devos-index" }
devos-docker = { path = "../crates/modules/devos-docker" }
devos-api = { path = "../crates/modules/devos-api" }
devos-db = { path = "../crates/modules/devos-db" }
devos-system = { path = "../crates/modules/devos-system" }
devos-monitor = { path = "../crates/modules/devos-monitor" }
devos-deploy = { path = "../crates/modules/devos-deploy" }
devos-issue = { path = "../crates/modules/devos-issue" }
devos-snippets = { path = "../crates/modules/devos-snippets" }
devos-mcp = { path = "../crates/modules/devos-mcp" }
devos-security = { path = "../crates/modules/devos-security" }
devos-envfile = { path = "../crates/modules/devos-envfile" }
devos-redact = { path = "../crates/devos-redact" }
sqlx.workspace = true
tauri = { version = "2", features = ["protocol-asset", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
uuid.workspace = true
tauri-plugin-updater = "2.10.1"
url = "2"

[dev-dependencies]
tempfile = "3"
